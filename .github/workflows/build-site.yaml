name: build-site
run-name: build live site

on:
  # run when called from another workflow
  workflow_call:

  # run if user manually requests it
  workflow_dispatch:

# variables
env:
  PREVIEWS_FOLDER: preview

permissions:
  contents: write

jobs:
  build-site:
    runs-on: ubuntu-24.04

    steps:
      - name: Debug dump
        uses: crazy-max/ghaction-dump-context@v2

      - name: Checkout branch contents
        uses: actions/checkout@v4
        with:
          # 푸시된 커밋이 아니라 브랜치의 최신 상태를 가져옴
          # → 직전 단계에서 자동 커밋된 citations.yaml까지 포함해서 빌드
          ref: ${{ github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Reuse resized images from earlier builds
        uses: actions/cache@v4
        with:
          path: .cache/img
          key: img-${{ hashFiles('images/**') }}
          restore-keys: img-

      - name: Get Pages url
        id: pages
        uses: actions/configure-pages@v4

      - name: SSH debug
        if: runner.debug == '1'
        uses: mxschmitt/action-tmate@v3

      - name: Build live version of site
        run: |
          npx @11ty/eleventy --pathprefix="${{ steps.pages.outputs.base_path || '' }}/"

      # GitHub Pages가 gh-pages 브랜치를 Jekyll로 다시 처리하지 않도록 막는다.
      - name: Disable Jekyll processing on Pages branch
        run: touch _site/.nojekyll

      - name: Commit live site to Pages branch
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          folder: _site
          clean-exclude: ${{ env.PREVIEWS_FOLDER }}
          force: false
