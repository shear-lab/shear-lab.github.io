name: build-site
run-name: build live site

on:
  # run when called from another workflow
  workflow_call:

  # run if user manually requests it
  workflow_dispatch:

# variables
env:
  PREVIEWS_FOLDER: preview

permissions:
  contents: write

jobs:
  build-site:
    runs-on: ubuntu-latest

    steps:
      - name: Debug dump
        uses: crazy-max/ghaction-dump-context@v2

      - name: Checkout branch contents
        uses: actions/checkout@v4
        with:
          # 푸시된 커밋이 아니라 브랜치의 최신 상태를 가져옴
          # → 직전 단계에서 자동 커밋된 citations.yaml까지 포함해서 빌드
          ref: ${{ github.ref }}

      - name: Install Ruby packages
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Get Pages url
        id: pages
        uses: actions/configure-pages@v4

      - name: SSH debug
        if: runner.debug == '1'
        uses: mxschmitt/action-tmate@v3

      - name: Set root url
        run: |
          printf "\n\nurl: ${{ steps.pages.outputs.origin }}" >> _config.yaml

      - name: Build live version of site
        run: |
          JEKYLL_ENV=production bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path || '' }}"

      # GitHub Pages가 gh-pages 브랜치에서 Jekyll을 다시 돌리면
      # 밑줄로 시작하는 _styles/, _scripts/ 폴더를 통째로 무시해서
      # CSS와 JS가 404가 된다(=사이트가 스타일 없이 깨져 보임).
      # .nojekyll 파일을 넣어 재처리를 막는다.
      - name: Disable Jekyll processing on Pages branch
        run: touch _site/.nojekyll

      - name: Commit live site to Pages branch
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          folder: _site
          clean-exclude: ${{ env.PREVIEWS_FOLDER }}
          force: false
